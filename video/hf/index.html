<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ground: #f6f1ea; --ink: #2b211a; --brand: #e0592a; --navy: #0b2a5c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, sans-serif; }
      .bg { position: absolute; inset: 0; background: var(--ground); }
      .foot { position: absolute; inset: 0; overflow: hidden; }
      .foot video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="47" data-width="1920" data-height="1080">
      <div class="bg"></div>
      <div id="wave" data-composition-id="wave" data-composition-src="compositions/wave.html" data-start="0" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="small" data-composition-id="small" data-composition-src="compositions/small.html" data-start="5.6" data-duration="9.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="mission" data-composition-id="mission" data-composition-src="compositions/mission.html" data-start="14.8" data-duration="8.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="brand" data-composition-id="brand" data-composition-src="compositions/brand.html" data-start="23.4" data-duration="8.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- real product footage: Playwright recording of jomm.onrender.com/demo -->
      <div class="foot" id="foot5w">
        <video id="deal1" class="clip" src="assets/deal.mp4" muted playsinline data-start="32" data-duration="7.6" data-media-start="8" data-playback-rate="2" data-track-index="2" style="z-index:2"></video>
      </div>
      <div class="foot" id="foot6w">
        <video id="deal2" class="clip" src="assets/deal.mp4" muted playsinline data-start="39.6" data-duration="2.6" data-media-start="25.4" data-track-index="2" style="z-index:3"></video>
        <video id="deal3" class="clip" src="assets/deal.mp4" muted playsinline data-start="42.2" data-duration="4.8" data-media-start="48.6" data-track-index="2" style="z-index:4"></video>
      </div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="32" data-duration="15" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:10"></div>

      <audio id="vo1" class="clip" src="assets/vo/n1.mp3" data-duration="5.21" data-start="0.2" data-volume="1" data-track-index="5"></audio>
      <audio id="vo2" class="clip" src="assets/vo/n2.mp3" data-duration="8.62" data-start="5.8" data-volume="1" data-track-index="5"></audio>
      <audio id="vo3" class="clip" src="assets/vo/n3.mp3" data-duration="8.02" data-start="15.0" data-volume="1" data-track-index="5"></audio>
      <audio id="vo4" class="clip" src="assets/vo/n4.mp3" data-duration="8.16" data-start="23.6" data-volume="1" data-track-index="5"></audio>
      <audio id="vo5" class="clip" src="assets/vo/n5.mp3" data-duration="7.2" data-start="32.2" data-volume="1" data-track-index="5"></audio>
      <audio id="vo6" class="clip" src="assets/vo/n6.mp3" data-duration="5.62" data-start="40.0" data-volume="1" data-track-index="5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // camera on the footage: punch into the conversation, then the PayPal panel + phone
      tl.fromTo("#foot5w", { scale: 1.02, x: 0, y: 0 }, { scale: 1.45, x: 330, y: 60, duration: 1.2, ease: "power2.inOut" }, 32.8);
      tl.to("#foot5w", { scale: 1.45, x: 330, y: -140, duration: 5, ease: "power1.inOut" }, 34.0);
      tl.set("#foot6w", { scale: 1.3, x: 300, y: -60 }, 0);
      tl.to("#foot6w", { scale: 1.35, x: -260, y: 80, duration: 0.6, ease: "power3.inOut" }, 42.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
