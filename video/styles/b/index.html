<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #141010; }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, sans-serif; }
      .bg { position: absolute; inset: 0; background: #141010; }
      .fw { position: absolute; overflow: hidden; }
      .fw video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44.5" data-width="1920" data-height="1080">
      <div class="bg"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="small" data-composition-id="small" data-composition-src="compositions/small.html" data-start="5.6" data-duration="9.0" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="mission" data-composition-id="mission" data-composition-src="compositions/mission.html" data-start="14.6" data-duration="7.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="how" data-composition-id="how" data-composition-src="compositions/how.html" data-start="22.0" data-duration="8.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="sell" data-composition-id="sell" data-composition-src="compositions/sell.html" data-start="30.2" data-duration="7.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="37.6" data-duration="6.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div class="fw" id="teachw" style="left:120px;top:220px;width:1680px;height:680px;border:3px solid #e0592a;z-index:3">
        <div id="teachcam" style="position:absolute;inset:0">
          <video id="teachv" class="clip" src="assets/teach.mp4" muted playsinline data-start="22.6" data-duration="7.6" data-media-start="4" data-playback-rate="6" data-track-index="2" style="left:-140px;top:-120px;width:1960px;height:1103px;object-fit:fill"></video>
        </div>
      </div>
      <div class="fw" id="sellw" style="left:0;top:0;width:1920px;height:1080px;z-index:3">
        <div id="sellcam" style="position:absolute;inset:0">
          <video id="sellv1" class="clip" src="assets/deal.mp4" muted playsinline data-start="30.2" data-duration="3.6" data-media-start="9" data-playback-rate="2" data-track-index="2"></video>
          <video id="sellv2" class="clip" src="assets/deal.mp4" muted playsinline data-start="33.8" data-duration="3.8" data-media-start="48.8" data-track-index="2"></video>
        </div>
      </div>
      <audio id="vo1" class="clip" src="assets/vo/v1.mp3" data-start="0.2" data-duration="5.21" data-volume="1" data-track-index="7"></audio>
      <audio id="vo2" class="clip" src="assets/vo/v2.mp3" data-start="5.8" data-duration="8.62" data-volume="1" data-track-index="6"></audio>
      <audio id="vo3" class="clip" src="assets/vo/v3.mp3" data-start="14.8" data-duration="7.01" data-volume="1" data-track-index="7"></audio>
      <audio id="vo4" class="clip" src="assets/vo/v4.mp3" data-start="22.2" data-duration="7.76" data-volume="1" data-track-index="6"></audio>
      <audio id="vo5" class="clip" src="assets/vo/v5.mp3" data-start="30.4" data-duration="6.92" data-volume="1" data-track-index="7"></audio>
      <audio id="vo6" class="clip" src="assets/vo/v6.mp3" data-start="37.8" data-duration="5.62" data-volume="1" data-track-index="6"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#teachw", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 22.6);
      tl.to("#teachw", { opacity: 0, duration: 0.15 }, 30.0);
      tl.set("#sellcam", { scale: 1.35, x: 300, y: -40 }, 0);
      tl.to("#sellcam", { y: -200, duration: 3.4, ease: "power1.inOut" }, 30.3);
      tl.set("#sellcam", { scale: 1.3, x: -40, y: 60 }, 33.8);
      tl.to("#sellcam", { scale: 1.45, x: -330, y: 120, duration: 0.8, ease: "power3.inOut" }, 34.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
