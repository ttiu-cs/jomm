<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#888}
.ic{width:800px;height:800px;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.jomm{display:inline-flex;align-items:baseline;font-weight:700;letter-spacing:-0.04em;line-height:1}
.jomm .ring{display:inline-block;width:.6em;height:.6em;border:.15em solid #e0592a;border-radius:50%;margin:0 .02em;position:relative;top:.02em}
.jomm .dot{display:inline-block;width:.24em;height:.24em;border-radius:50%;background:#e0592a;margin-left:.05em}
#a{background:#f6f1ea;color:#2b211a}
#a .jomm{font-size:200px}
#b{background:#f6f1ea}
#b .mk{display:flex;align-items:flex-end;gap:34px}
#b .r{width:330px;height:330px;border:82px solid #e0592a;border-radius:50%}
#b .d{width:132px;height:132px;border-radius:50%;background:#e0592a;margin-bottom:6px}
#c{background:#1f1813;color:#fff}
#c .jomm{font-size:200px}
#d{background:#e0592a;color:#fff}
#d .jomm{font-size:200px}
#d .ring{border-color:#fff}#d .dot{background:#fff}
</style></head><body>
<div class="ic" id="a"><span class="jomm"><span>J</span><span class="ring"></span><span>mm</span><span class="dot"></span></span></div>
<div class="ic" id="b"><div class="mk"><div class="r"></div><div class="d"></div></div></div>
<div class="ic" id="c"><span class="jomm"><span>J</span><span class="ring"></span><span>mm</span><span class="dot"></span></span></div>
<div class="ic" id="d"><span class="jomm"><span>J</span><span class="ring"></span><span>mm</span><span class="dot"></span></span></div>
</body></html>
